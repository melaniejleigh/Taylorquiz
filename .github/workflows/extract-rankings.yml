name: Extract critic rankings

on:
  push:
    paths:
      - ".github/workflows/extract-rankings.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Download and extract ranking sources
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          import openpyxl

          url="https://www.listobsession.com/wp-content/uploads/Best-Taylor-Swift-Songs.xlsx"
          path="/tmp/rankings.xlsx"
          urllib.request.urlretrieve(url,path)
          wb=openpyxl.load_workbook(path,data_only=True)

          out={"sheets":{}, "sources":{}}
          ws=wb["Raw Data"]
          rows=list(ws.iter_rows(values_only=True))
          out["sheets"][ws.title]={"rows":len(rows),"cols":ws.max_column,"sample":[list(r[:20]) for r in rows[:8]]}
          headers=[str(v).strip() if v is not None else "" for v in rows[3]]
          targets=["Rolling Stone","Vulture","Variety","Ranker"]
          for target in targets:
              try: ci=headers.index(target)
              except ValueError: continue
              items=[]
              for rr in rows[4:]:
                  rank=rr[0] if len(rr)>0 else None
                  title=rr[ci] if ci < len(rr) else None
                  if isinstance(rank,(int,float)) and title:
                      items.append({"title":str(title).strip(),"rank":int(rank)})
              out["sources"][target]=items

          # Historical TS Ranked fan aggregate (2019-era site), if its old API is still reachable.
          try:
              api=json.load(urllib.request.urlopen("https://ts-ranked-server.jrobsonjr.now.sh/api/scores",timeout=20))
              js=urllib.request.urlopen("https://raw.githubusercontent.com/JRobsonJr/ts-ranked/master/src/api/albums.js",timeout=20).read().decode()
              pairs=re.findall(r"name:\s*['\"]([^'\"]+)['\"][^}]*spotifyId:\s*['\"]([^'\"]+)['\"]",js,re.S)
              id_to_title={sid:name for name,sid in pairs}
              scores=api.get("data",api if isinstance(api,list) else [])
              ranked=sorted(scores,key=lambda x:x.get("score",0),reverse=True)
              out["sources"]["TS Ranked"]=[
                  {"title":id_to_title.get(x.get("trackId"),x.get("trackId")),"rank":i+1,"score":x.get("score")}
                  for i,x in enumerate(ranked) if id_to_title.get(x.get("trackId"))
              ]
          except Exception as e:
              out["ts_ranked_error"]=str(e)
          Path("critic-ranking-extract.json").write_text(json.dumps(out,indent=2,ensure_ascii=False,default=str))
          PY
      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add critic-ranking-extract.json
          git commit -m "Extract critic ranking source data" || exit 0
          git push
